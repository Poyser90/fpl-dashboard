# Builds the FPL dashboard and publishes it to this repository's web page.
# It only runs when you press "Run workflow" (on the Actions tab, or in the
# GitHub app on your phone). There is no schedule, so no odds credits are
# used unless you ask for a run.
name: Build FPL dashboard

on:
  workflow_dispatch:
    inputs:
      fresh_odds:
        description: 'Fetch fresh odds (ignore 6-hour cache)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reuse odds-cache.json across runs; fpl.js checks the 6-hour limit and gameweek.
      # Skipped if you ticked "Fetch fresh odds" when starting the workflow.
      - name: Restore cached odds
        if: ${{ !inputs.fresh_odds }}
        uses: actions/cache/restore@v4
        with:
          path: odds-cache.json
          key: odds-cache-${{ github.run_id }}
          restore-keys: |
            odds-cache-

      - name: Build the dashboard
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # the hidden setting; never shown in logs
        run: |
          node fpl.js
          mkdir site
          cp dashboard.html site/index.html
          cp apple-touch-icon.png site/   # the home-screen icon

      - name: Save cached odds
        if: ${{ hashFiles('odds-cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: odds-cache.json
          key: odds-cache-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
